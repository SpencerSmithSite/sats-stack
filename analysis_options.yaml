# Analyzer and lint configuration.
#
# CI runs a bare `flutter analyze`, which fails on any issue including infos,
# so every rule here is held at zero. A rule belongs here when it catches a
# bug class this codebase has actually had, or keeps a convention it already
# follows from regressing.

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # A property read on decoded JSON that is not the expected shape throws
    # NoSuchMethodError, mid-stream: an AI answer cut off by one odd frame. JSON
    # is read with `is` checks and patterns instead.
    avoid_dynamic_calls: true
    # Bug classes this codebase has had.
    #
    # A future dropped on the floor: errors vanish and ordering is lost — the
    # import consent write and the insight generation both had this shape.
    unawaited_futures: true
    # A subscription or controller nobody closes keeps its stream, and with a
    # Drift stream a live query, running after the screen has gone.
    cancel_subscriptions: true
    close_sinks: true
    # An `async` function returning void cannot be awaited, so its errors are
    # unhandled and a caller cannot know when it has finished.
    avoid_void_async: true
    # Throwing a String loses the type a caller would catch on.
    only_throw_errors: true

    # Conventions the code already follows everywhere.
    prefer_single_quotes: true
    always_declare_return_types: true
    use_super_parameters: true
    prefer_final_locals: true
    directives_ordering: true

    # Considered and not enabled:
    #
    # require_trailing_commas — the formatter manages trailing commas itself
    #   from language version 3.7 (the "tall" style), so the two would fight.
    # avoid_dynamic_calls — 43 sites, nearly all JSON decoding; worth doing as
    #   typed parsing rather than as 43 casts to silence it. Tracked in TODO.md.
    # discarded_futures — 47 sites, mostly fire-and-forget calls from
    #   synchronous callbacks; `unawaited_futures` covers the async case that
    #   matters, and `unawaited(...)` marks the rest where it is deliberate.
