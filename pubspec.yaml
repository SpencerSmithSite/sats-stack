name: sats_stack
description: Local-first Bitcoin-native personal finance app.
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  drift: ^2.23.0
  drift_flutter: ^0.2.8

  # Navigation
  go_router: ^16.3.0

  # HTTP / Networking
  http: ^1.3.0

  # Cryptography
  crypto: ^3.0.0
  pointycastle: ^4.0.0

  # Bitcoin
  bs58check: ^1.0.2
  bech32: ^0.2.2

  # CSV Import
  csv: ^8.0.0

  # Charts
  fl_chart: ^0.71.0

  # File Picking
  file_picker: ^10.3.10
  image_picker: ^1.1.0

  # Explicit because `database.dart` joins the database path itself — it is
  # already in the tree via drift, but an undeclared import is a lint and a
  # hostage to someone else's dependency.
  path: ^1.9.0

  # Local Storage
  # No shared_preferences: every setting lives in the Drift `AppSettings` table
  # (so Settings → Data exports it) and every secret in the keychain via
  # `SecureKeyStore`. It was declared but never imported, and an unused plugin
  # is still a native dependency in all six platform builds.
  path_provider: ^2.1.5

  # API keys for the hosted AI providers. Keychain on Apple platforms, the
  # EncryptedSharedPreferences-backed store on Android — anywhere but the app's
  # own SQLite file, which is exported in plaintext by Settings → Data and is
  # the same file the agent-access plan proposes handing to an MCP server.
  flutter_secure_storage: ^9.2.2

  # Formatting
  intl: ^0.19.0

  # App metadata
  package_info_plus: ^8.0.0

  # Opens each hosted provider's "create an API key" page in the browser.
  # "Where do I get this?" is the first question every time a key field appears,
  # and the answer is a different URL per provider.
  url_launcher: ^6.3.0

  # Local Notifications
  flutter_local_notifications: ^19.5.0

  # PDF text extraction
  syncfusion_flutter_pdf: ^28.1.0

flutter:
  uses-material-design: true
  # Not assets/icons/: those are the icon and splash generators' sources,
  # which they read from the repo by path. Nothing in the app loads them, and
  # bundling them shipped 110 KB of PNGs in every build.
  assets:
    # Roboto Mono's licence. The OFL requires it to travel with the font; it
    # is shown under Settings → About → Licences.
    - assets/fonts/OFL.txt
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Medium.ttf
          weight: 500

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs tests against a real Flutter engine on a real device, which is the only
  # way to exercise the platform channels the on-device AI backends depend on —
  # `flutter test` has no engine, so a MethodChannel there always returns null.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.0
  # Not used directly: held for drift_dev. drift_dev 2.31, the newest the
  # drift_flutter hold allows, accepts analyzer 10 but generates without the
  # tables' REFERENCES clauses and the managers' reference classes under it.
  # Lift with the drift_flutter 0.3 upgrade.
  analyzer: ">=8.1.1 <9.0.0"
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  color: "#141414"
  image: assets/icons/satsstack_icon_dark.png
  android: true
  # The iOS launch image in LaunchImage.imageset is drawn by hand; running the
  # generator with this on would overwrite it.
  ios: false
  # Android 12+ uses the system splash, set in values-v31/styles.xml to match.
  android_12:
    color: "#141414"
