name: sats_stack
description: Local-first Bitcoin-native personal finance app.
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  drift: ^2.23.0
  drift_flutter: ^0.2.8

  # Navigation
  go_router: ^16.3.0

  # HTTP / Networking
  http: ^1.3.0

  # Cryptography
  crypto: ^3.0.0
  pointycastle: ^4.0.0

  # Bitcoin
  bs58check: ^1.0.2
  bech32: ^0.2.2

  # CSV Import
  csv: ^6.0.0

  # Charts
  fl_chart: ^0.71.0

  # File Picking
  file_picker: ^10.3.10
  image_picker: ^1.1.0

  # Local Storage
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # API keys for the hosted AI providers. Keychain on Apple platforms, the
  # EncryptedSharedPreferences-backed store on Android — anywhere but the app's
  # own SQLite file, which is exported in plaintext by Settings → Data and is
  # the same file the agent-access plan proposes handing to an MCP server.
  flutter_secure_storage: ^9.2.2

  # Formatting
  intl: ^0.19.0

  # App metadata
  package_info_plus: ^8.0.0

  # Opens each hosted provider's "create an API key" page in the browser.
  # "Where do I get this?" is the first question every time a key field appears,
  # and the answer is a different URL per provider.
  url_launcher: ^6.3.0

  # Local Notifications
  flutter_local_notifications: ^19.5.0

  # PDF text extraction
  syncfusion_flutter_pdf: ^28.1.0

  # Runs a downloaded small language model on-device, for devices with no
  # built-in one. Chosen over the alternatives on maintenance rather than
  # features: `fllama`, `llama_cpp_dart` and `cactus` have all gone many months
  # between releases, and an unmaintained dependency in the generation path is
  # a liability.
  flutter_gemma: ^1.4.2

  # The engine that actually runs the weights. `flutter_gemma` is only a core
  # since 1.0 and registers no engine on its own — without this, every download
  # succeeds and then fails at the first question with "FlutterGemma not
  # initialized".
  #
  # LiteRT-LM rather than the MediaPipe engine because it is the only one
  # covering desktop as well as phones: it reads `.litertlm` on Android, iOS,
  # macOS, Windows and Linux, where MediaPipe reads `.task` on Android and iOS
  # alone.
  flutter_gemma_litertlm: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Medium.ttf

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs tests against a real Flutter engine on a real device, which is the only
  # way to exercise the platform channels the on-device AI backends depend on —
  # `flutter test` has no engine, so a MethodChannel there always returns null.
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.23.0
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  color: "#141414"
  image: assets/icons/satsstack_icon_dark.png
  android: true
  ios: true
