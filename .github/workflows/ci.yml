name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the previous run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the SDK this project is actually developed against, so CI
          # cannot pass on a version nobody runs. Bump it here when the local
          # SDK moves.
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No --no-fatal-infos: the ~40 info lints it existed to tolerate are
      # cleared, so `flutter analyze` is now held at zero issues of any
      # severity. It exits non-zero on infos as well as errors and warnings,
      # which is what keeps them from drifting back one deprecation at a time.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
