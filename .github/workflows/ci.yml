name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the previous run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Nothing here writes to the repository, and a token that cannot
# is one a compromised step cannot misuse.
permissions:
  contents: read

# Pinned to the SDK this project is actually developed against, so CI cannot
# pass on a version nobody runs. Bump it here when the local SDK moves.
env:
  FLUTTER_VERSION: 3.47.2

jobs:
  analyze-and-test:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    # Every job has a ceiling: a hung step used to run to GitHub's six-hour
    # limit, billing the whole time (audit P-9). Each is about three times a
    # normal run.
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit, with the tag it was in a comment: a
      # tag can be moved to new code, a commit cannot (audit P-3). Dependabot
      # proposes the updates. No step pushes, so the checkout keeps no token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # --enforce-lockfile: resolve exactly what pubspec.lock records, and fail
      # if the lockfile and pubspec disagree, rather than quietly resolving
      # something newer than anyone has run.
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # sqlite3 3's build hook downloads SQLite from the sqlite3.dart GitHub
      # release on every clean build, and a GitHub outage failed CI once.
      # Cached per job and sqlite3 version; the hook re-checks each cached
      # file's SHA-256 and downloads again on a mismatch. The `\r` strip is
      # for the Windows checkout's CRLF line endings.
      - name: SQLite version
        id: sqlite
        shell: bash
        run: >-
          echo "version=$(awk '{sub(/\r$/, "")} $0 == "  sqlite3:" {f = 1}
          f && /version:/ {gsub(/"/, "", $2); print $2; exit}' pubspec.lock)"
          >> "$GITHUB_OUTPUT"

      - name: Cache the SQLite download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3/build/download-*
          key: sqlite3-test-${{ steps.sqlite.outputs.version }}

      # Every tracked Dart file, generated code included — Drift's output is
      # already in the formatter's style, so a schema change does not trip it.
      - name: Format
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      # The generated Drift code is committed. A table changed without
      # re-running the generator compiles against stale code — or does not
      # compile, but only once someone else regenerates it.
      - name: Generated code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart'

      # Held at zero issues of any severity: `flutter analyze` exits non-zero
      # on infos as well as errors and warnings, which keeps them from drifting
      # back one deprecation at a time.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The runner is on UTC, which has no daylight saving, so the tests that
      # guard recurring dates and month edges across a DST change passed there
      # trivially. Run them again where the clocks change.
      - name: Test date handling in a DST time zone
        env:
          TZ: America/New_York
        run: >-
          flutter test
          test/data_layer_transaction_service_test.dart
          test/recurring_series_test.dart
          test/month_boundary_test.dart
          test/dedup_hash_test.dart
          test/stack_stats_test.dart

  # Analysis and tests compile no native code, so none of the platform
  # findings in docs/AUDIT.md could have been caught by the job above: no
  # manifest merge, no Xcode project, no entitlements, neither native AI
  # bridge.
  android:
    name: Build Android (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 21, as used locally. Not 25: the Kotlin 2.1 Gradle plugin cannot parse
      # that version string.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Flutter's default NDK is not one the runner image ships, so it was
      # downloaded on every run.
      - name: Cache the NDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: android-ndk-28.2.13676358

      - run: flutter pub get --enforce-lockfile

      # As in the test job: the SQLite the build hook downloads.
      - name: SQLite version
        id: sqlite
        shell: bash
        run: >-
          echo "version=$(awk '{sub(/\r$/, "")} $0 == "  sqlite3:" {f = 1}
          f && /version:/ {gsub(/"/, "", $2); print $2; exit}' pubspec.lock)"
          >> "$GITHUB_OUTPUT"

      - name: Cache the SQLite download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3/build/download-*
          key: sqlite3-android-${{ steps.sqlite.outputs.version }}

      # Release, not debug. A debug build merges in a manifest that declares
      # INTERNET whatever `src/main` says, so it could never catch the missing
      # permission it was added to catch; and R8 runs only in release.
      #
      # Through Gradle rather than `flutter build apk`: CI has no signing key,
      # so the APK is unsigned, which the Flutter tool does not look for.
      - name: Build release APK (unsigned, R8)
        run: |
          flutter build apk --release --config-only
          cd android && ./gradlew --no-daemon :app:assembleRelease

      - name: Release manifest declares INTERNET
        run: |
          manifest=$(find build/app/intermediates -name AndroidManifest.xml \
            -path '*merged_manifests/release*' | head -1)
          test -n "$manifest"
          grep -q 'android.permission.INTERNET' "$manifest"

      # ML Kit's usage reports to Google go through this backend; the main
      # manifest removes it (audit P-5).
      - name: Release manifest has no telemetry upload backend
        run: |
          manifest=$(find build/app/intermediates -name AndroidManifest.xml \
            -path '*merged_manifests/release*' | head -1)
          test -n "$manifest"
          ! grep -q 'CctBackendFactory' "$manifest"

  apple:
    name: Build ${{ matrix.platform }}
    # Pinned, as Xcode is below: `macos-latest` and `latest-stable` moved
    # under the project without a commit saying so.
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Foundation Models bridge needs the iOS/macOS 26 SDK. Bump with
      # the runner image.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      # As in the test job: the SQLite the build hook downloads.
      - name: SQLite version
        id: sqlite
        shell: bash
        run: >-
          echo "version=$(awk '{sub(/\r$/, "")} $0 == "  sqlite3:" {f = 1}
          f && /version:/ {gsub(/"/, "", $2); print $2; exit}' pubspec.lock)"
          >> "$GITHUB_OUTPUT"

      - name: Cache the SQLite download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3/build/download-*
          key: sqlite3-${{ matrix.platform }}-${{ steps.sqlite.outputs.version }}

      # Release, as Android is: only debug was built, so anything that breaks
      # under AOT compilation, tree shaking or the release Xcode settings
      # could ship (audit P-9). Unsigned: CI has no Apple certificate.
      - name: Build iOS (release, unsigned)
        if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign

      - name: Build macOS (release)
        if: matrix.platform == 'macos'
        run: flutter build macos --release

      # The integration tests that apply to macOS, against the real plugins:
      # the keychain store, path provider, the database (SQLite as the build
      # hook bundles it), and the Apple Intelligence bridge, which skips itself
      # where the model is unavailable, as on a runner.
      # Named, not globbed: gemini_nano_test is Android-only by design (it
      # asserts the Android bridge is registered). One file per run: on macOS
      # a second file in one invocation cannot reattach to the relaunched app.
      - name: Integration tests (macOS)
        if: matrix.platform == 'macos'
        run: |
          for test in apple_intelligence database path_provider secure_key_store; do
            flutter test "integration_test/${test}_test.dart" -d macos
          done

  # Linux and Windows ship too, so they are built like the others: the
  # folders were tracked but never compiled, and could rot unseen (audit
  # P-9).
  linux:
    name: Build Linux (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Flutter's Linux toolchain (GTK 3, CMake, Ninja, Clang), and
      # libsecret and jsoncpp for flutter_secure_storage's Linux keyring.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      # As in the test job: the SQLite the build hook downloads.
      - name: SQLite version
        id: sqlite
        shell: bash
        run: >-
          echo "version=$(awk '{sub(/\r$/, "")} $0 == "  sqlite3:" {f = 1}
          f && /version:/ {gsub(/"/, "", $2); print $2; exit}' pubspec.lock)"
          >> "$GITHUB_OUTPUT"

      - name: Cache the SQLite download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3/build/download-*
          key: sqlite3-linux-${{ steps.sqlite.outputs.version }}

      - name: Build Linux (release)
        run: flutter build linux --release

  windows:
    name: Build Windows (release)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      # As in the test job: the SQLite the build hook downloads.
      - name: SQLite version
        id: sqlite
        shell: bash
        run: >-
          echo "version=$(awk '{sub(/\r$/, "")} $0 == "  sqlite3:" {f = 1}
          f && /version:/ {gsub(/"/, "", $2); print $2; exit}' pubspec.lock)"
          >> "$GITHUB_OUTPUT"

      - name: Cache the SQLite download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3/build/download-*
          key: sqlite3-windows-${{ steps.sqlite.outputs.version }}

      - name: Build Windows (release)
        run: flutter build windows --release
