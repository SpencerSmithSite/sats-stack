name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the previous run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Nothing here writes to the repository, and a token that cannot
# is one a compromised step cannot misuse.
permissions:
  contents: read

# Pinned to the SDK this project is actually developed against, so CI cannot
# pass on a version nobody runs. Bump it here when the local SDK moves.
env:
  FLUTTER_VERSION: 3.47.2

jobs:
  analyze-and-test:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # --enforce-lockfile: resolve exactly what pubspec.lock records, and fail
      # if the lockfile and pubspec disagree, rather than quietly resolving
      # something newer than anyone has run.
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Every tracked Dart file, generated code included — Drift's output is
      # already in the formatter's style, so a schema change does not trip it.
      - name: Format
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      # The generated Drift code is committed. A table changed without
      # re-running the generator compiles against stale code — or does not
      # compile, but only once someone else regenerates it.
      - name: Generated code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart'

      # Held at zero issues of any severity: `flutter analyze` exits non-zero
      # on infos as well as errors and warnings, which keeps them from drifting
      # back one deprecation at a time.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Analysis and tests compile no native code, so none of the platform
  # findings in docs/AUDIT.md could have been caught by the job above: no
  # manifest merge, no Podfile, no entitlements, neither native AI bridge.
  android:
    name: Build Android (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 21, as used locally. Not 25: the Kotlin 2.1 Gradle plugin cannot parse
      # that version string.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Flutter's default NDK is not one the runner image ships, so it was
      # downloaded on every run.
      - name: Cache the NDK
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: android-ndk-28.2.13676358

      - run: flutter pub get --enforce-lockfile

      # Release, not debug. A debug build merges in a manifest that declares
      # INTERNET whatever `src/main` says, so it could never catch the missing
      # permission it was added to catch; and R8 runs only in release.
      #
      # Through Gradle rather than `flutter build apk`: CI has no signing key,
      # so the APK is unsigned, which the Flutter tool does not look for.
      - name: Build release APK (unsigned, R8)
        run: |
          flutter build apk --release --config-only
          cd android && ./gradlew --no-daemon :app:assembleRelease

      - name: Release manifest declares INTERNET
        run: |
          manifest=$(find build/app/intermediates -name AndroidManifest.xml \
            -path '*merged_manifests/release*' | head -1)
          test -n "$manifest"
          grep -q 'android.permission.INTERNET' "$manifest"

  apple:
    name: Build ${{ matrix.platform }}
    # Pinned, as Xcode is below: `macos-latest` and `latest-stable` moved
    # under the project without a commit saying so.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    env:
      # pod install fails with "Unicode Normalization not appropriate for
      # ASCII-8BIT" without a UTF-8 locale.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7

      # The Foundation Models bridge needs the iOS/macOS 26 SDK. Bump with
      # the runner image.
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Pods
        uses: actions/cache@v6
        with:
          path: ${{ matrix.platform }}/Pods
          key: pods-${{ matrix.platform }}-${{ hashFiles(format('{0}/Podfile.lock', matrix.platform)) }}

      - run: flutter pub get --enforce-lockfile

      - name: Build iOS (unsigned)
        if: matrix.platform == 'ios'
        run: flutter build ios --debug --no-codesign

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: flutter build macos --debug
