# Update proposals for the workflow actions, which are pinned to commits
# (audit P-3) and so never move on their own. Each arrives as a PR to review
# like any other.
#
# There is no `pub` entry, on purpose. Dependabot's pub updater has no
# lockfile-only mode, and a grouped update moves whatever the updated package
# needs, past every ignore rule: build_runner 2.15.2+ needs analyzer 13, which
# dragged drift_flutter to 0.3 and broke the generated database code (#99,
# #109). Everything else it proposed was a major. Dart packages are upgraded
# by hand, after `flutter pub outdated`, one PR each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
