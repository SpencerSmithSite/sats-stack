# Update proposals for the workflow actions (pinned to commits) and the Dart
# packages (audit P-3). Each arrives as a PR to review like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Only what pubspec.yaml's constraints already allow — `flutter pub
    # upgrade`, as a PR. Without it Dependabot rewrote the constraints: its
    # first group moved drift_flutter to 0.3 and analyzer to 14 despite the
    # holds, which breaks the generated database code. Majors are upgraded
    # on purpose, by hand.
    versioning-strategy: lockfile-only
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # Held on purpose — see "Critical package version pins" in CLAUDE.md.
      # The constraints already hold them; this is in case they are widened.
      - dependency-name: analyzer
        versions: ['>=9.0.0']
      - dependency-name: drift_flutter
        versions: ['>=0.3.0']
      - dependency-name: fl_chart
        versions: ['>=1.0.0']
      - dependency-name: flutter_secure_storage
        versions: ['>=10.0.0']
